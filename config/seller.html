<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Mart - Seller Dashboard</title>
<script src="/config/api-config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f2f5}
.header{background:#ff9800;color:white;padding:15px 30px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px}.header button{padding:8px 16px;border:none;border-radius:5px;cursor:pointer;background:white;color:#ff9800;margin-left:10px}
.container{max-width:1100px;margin:20px auto;padding:0 20px}
.card{background:white;border-radius:8px;padding:15px;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:15px}
.stats{display:flex;gap:15px;margin-bottom:15px}.stat{flex:1;background:white;padding:15px;border-radius:8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.form input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:5px}.form button{padding:10px 15px;background:#ff9800;color:white;border:none;border-radius:5px;cursor:pointer;margin-top:5px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}th{background:#fff3e0}td button{padding:5px 8px;border:none;border-radius:4px;cursor:pointer;margin-right:4px}
.btn-edit{background:#2196F3;color:white}.btn-del{background:#f44336;color:white}
.msg{padding:10px;border-radius:5px;display:none;margin-top:10px}.msg.ok{background:#d4edda;color:#155724}.msg.err{background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<div class="header">
  <h1>🏪 Sri Mart — Seller Dashboard</h1>
  <div><span id="userInfo" style="font-size:14px"></span><button onclick="logout()">Logout</button></div>
</div>
<div class="container">
  <div class="stats">
    <div class="stat"><h3 id="prodCount">0</h3><div>Products in store</div></div>
    <div class="stat"><h3 id="sellerRole">-</h3><div>Your Role</div></div>
    <div class="stat"><h3>Live</h3><div>Synced with the buyer app</div></div>
  </div>

  <div class="card">
    <h3>Add a new product</h3>
    <div class="form">
      <input id="pname" placeholder="Product name *">
      <input id="pdesc" placeholder="Description">
      <input id="pprice" placeholder="Price *" type="number" step="0.01">
      <input id="pstock" placeholder="Stock" type="number">
      <button onclick="createProduct()">Create Product</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <div class="card">
    <h3>Your products</h3>
    <table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>ID</th><th>Actions</th></tr></thead><tbody id="prodTable"></tbody></table>
  </div>
  <div style="font-size:12px;color:#666;text-align:center">Edits appear instantly in the buyer app.</div>
</div>
<script>
// Fix: same-origin API base (was hardcoded http://localhost:8080).
const API=(typeof sriApiBase === "function") ? sriApiBase() : window.location.origin;
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let token=localStorage.getItem('token');
let user=JSON.parse(localStorage.getItem('user')||'null');
if(!token || !user){ window.location.href='/'; }
document.getElementById('userInfo').textContent = user ? user.username+' ('+user.role+')' : '';
fetch(API+'/api/v1/auth/validate',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).then(d=>{
  if(d.error || (d.role!=='seller' && d.role!=='admin')){ alert('Seller login required'); window.location.href='/'; }
  else { document.getElementById('sellerRole').textContent=d.role; loadProducts(); loadStats(); }
});
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.style.display='block';setTimeout(()=>m.style.display='none',3000)}
async function loadStats(){
  const r=await fetch(API+'/api/v1/seller/stats',{headers:{'Authorization':'Bearer '+token}});
  const d=await r.json(); if(r.ok) document.getElementById('prodCount').textContent=d.productCount;
}
async function loadProducts(){
  const r=await fetch(API+'/api/v1/products'); const data=await r.json();
  const tbody=document.getElementById('prodTable'); tbody.innerHTML='';
  document.getElementById('prodCount').textContent=data.length;
  data.forEach(p=>{
    const tr=document.createElement('tr');
    const rowId = 'row-' + p.id.replace(/[^a-zA-Z0-9_-]/g,'');
    tr.id = rowId;
    tr.innerHTML=`<td>${escapeHtml(p.name)}</td><td>₹${escapeHtml(p.price)}</td><td>${escapeHtml(p.stock)}</td><td style="font-size:10px">${escapeHtml(p.id.substring(0,8))}</td>
    <td><button class="btn-edit">Edit</button>
    <button class="btn-del">Delete</button></td>`;
    tr.querySelector('.btn-edit').addEventListener('click', () => editProduct(p.id, p.name, p.price, p.stock, p.description||''));
    tr.querySelector('.btn-del').addEventListener('click', () => deleteProduct(p.id));
    tbody.appendChild(tr);
  });
}
async function createProduct(){
  const name=document.getElementById('pname').value;
  const description=document.getElementById('pdesc').value;
  const price=parseFloat(document.getElementById('pprice').value);
  const stock=parseInt(document.getElementById('pstock').value||'0');
  if(!name||!price){ showMsg('Name and price required','err'); return; }
  const r=await fetch(API+'/api/v1/products',{
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({name, description, price, stock})
  });
  const d=await r.json();
  if(r.ok){ showMsg('Product created','ok'); loadProducts(); document.getElementById('pname').value=''; document.getElementById('pprice').value=''; }
  else showMsg(d.error||'Failed','err');
}
async function editProduct(id, oldName, oldPrice, oldStock, oldDesc){
  const name=prompt('Edit name:', oldName); if(name===null) return;
  const price=parseFloat(prompt('Edit price:', oldPrice));
  const stock=parseInt(prompt('Edit stock:', oldStock));
  const description=prompt('Edit description:', oldDesc)||'';
  const r=await fetch(API+'/api/v1/products/'+id,{
    method:'PUT', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({name: name||oldName, price: isNaN(price)?oldPrice:price, stock: isNaN(stock)?oldStock:stock, description})
  });
  const d=await r.json();
  if(r.ok){ showMsg('Updated','ok'); loadProducts(); } else showMsg(d.error||'Update failed','err');
}
async function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  const r=await fetch(API+'/api/v1/products/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
  const d=await r.json();
  if(r.ok){ showMsg('Deleted','ok'); loadProducts(); } else showMsg(d.error||'Delete failed','err');
}
async function logout(){
  await fetch(API+'/api/v1/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+token}});
  localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href='/';
}
</script>
</body>
</html>
