<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Mart - Buyer Dashboard</title>
<script src="/config/api-config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f2f5}
.header{background:#4CAF50;color:white;padding:15px 30px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px}.header .user{font-size:14px}.header button{padding:8px 16px;border:none;border-radius:5px;cursor:pointer;background:white;color:#4CAF50;margin-left:10px}
.search{background:white;padding:15px 30px;display:flex;gap:10px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.search input, .search button{padding:10px;border:1px solid #ddd;border-radius:5px}.search input{flex:1}.search button{background:#4CAF50;color:white;border:none;cursor:pointer}
.container{display:flex;gap:20px;padding:20px;max-width:1200px;margin:auto}
.products{flex:3;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}
.card{background:white;border-radius:8px;padding:15px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card h3{margin-bottom:5px}.card .price{color:#4CAF50;font-weight:bold;margin:5px 0}.card button{width:100%;padding:8px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;margin-top:8px}
.card button:hover{background:#45a049}
.cart{flex:1;background:white;border-radius:8px;padding:15px;height:fit-content;box-shadow:0 2px 6px rgba(0,0,0,.1);min-width:280px}
.cart h3{margin-bottom:10px}.cart-item{display:flex;justify-content:space-between;margin:6px 0;font-size:13px;border-bottom:1px solid #eee;padding-bottom:4px}
.msg{padding:10px;margin:10px 0;border-radius:5px;display:none}.msg.ok{background:#d4edda;color:#155724}.msg.err{background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<div class="header">
  <h1>🛒 Sri Mart — Buyer</h1>
  <div><span class="user" id="userInfo"></span><button onclick="viewCart()">Cart (<span id="cartCount">0</span>)</button><button onclick="logout()">Logout</button></div>
</div>
<div class="search">
  <input id="q" placeholder="Search products by name...">
  <input id="minPrice" placeholder="Min price" type="number" style="width:120px">
  <input id="maxPrice" placeholder="Max price" type="number" style="width:120px">
  <button onclick="searchProducts()">Search</button>
  <button onclick="loadProducts()">All</button>
</div>
<div class="container">
  <div class="products" id="products"></div>
  <div class="cart">
    <h3>Your Cart</h3>
    <div id="cartItems">Loading...</div>
    <div style="margin-top:10px;font-weight:bold">Total: ₹<span id="cartTotal">0</span></div>
    <button onclick="checkout()" style="width:100%;margin-top:10px;padding:10px;background:#ff9800;color:white;border:none;border-radius:5px;cursor:pointer">Checkout / Billing</button>
    <div id="msg" class="msg"></div>
    <div style="margin-top:10px;font-size:12px;color:#666">Lively connected to DB: products from PostgreSQL, cart live via <code>/api/v1/cart</code></div>
    <hr style="margin:12px 0;border:none;border-top:1px solid #eee">
    <h3>My Orders</h3>
    <div id="orderList" style="font-size:13px;color:#888">Loading...</div>
    <button onclick="loadOrders()" style="width:100%;margin-top:8px;padding:8px;background:#2196F3;color:white;border:none;border-radius:5px;cursor:pointer">Refresh Orders</button>
  </div>
</div>
<button id="chatFab" onclick="toggleChat()" title="Chat with Sri Assistant" style="position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#4CAF50;color:white;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:1000">💬</button>
<div id="chatPanel" style="display:none;position:fixed;bottom:88px;right:20px;width:340px;max-width:calc(100vw - 40px);height:440px;max-height:60vh;background:white;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:1000;flex-direction:column;overflow:hidden">
  <div style="background:#4CAF50;color:white;padding:12px;font-weight:bold">Sri Assistant <span style="font-weight:normal;font-size:12px">· online</span></div>
  <div id="chatMsgs" style="flex:1;overflow-y:auto;padding:10px;font-size:13px;"></div>
  <div id="chatChips" style="padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;"></div>
  <div style="display:flex;border-top:1px solid #eee;">
    <input id="chatInput" placeholder="Ask about products, orders..." style="flex:1;border:none;padding:12px;outline:none;font-size:13px;min-width:0;">
    <button onclick="sendChat()" style="border:none;background:#4CAF50;color:white;padding:0 16px;cursor:pointer;font-size:16px;">➤</button>
  </div>
</div>
<script>
// Fix: same-origin API base (was hardcoded http://localhost:8080).
const API=(typeof sriApiBase === "function") ? sriApiBase() : window.location.origin;
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let token=localStorage.getItem('token');
let user=JSON.parse(localStorage.getItem('user')||'null');
if(!token || !user){ window.location.href='/'; }
document.getElementById('userInfo').textContent = user ? user.username+' ('+user.role+')' : '';
// Validate token lively with backend
fetch(API+'/api/v1/auth/validate',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).then(d=>{
  if(d.error){ logout(); } else { loadProducts(); viewCart(); loadOrders(); }
});
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');m.style.display='block';setTimeout(()=>m.style.display='none',3000)}
async function loadProducts(){
  const r=await fetch(API+'/api/v1/products'); const data=await r.json();
  renderProducts(data);
}
async function searchProducts(){
  const q=document.getElementById('q').value;
  const min=document.getElementById('minPrice').value;
  const max=document.getElementById('maxPrice').value;
  const url=new URL(API+'/api/v1/products/search');
  if(q) url.searchParams.set('q',q);
  if(min) url.searchParams.set('minPrice',min);
  if(max) url.searchParams.set('maxPrice',max);
  const r=await fetch(url); const data=await r.json();
  renderProducts(data);
}
function renderProducts(list){
  const c=document.getElementById('products'); c.innerHTML='';
  if(!list || list.length===0){ c.innerHTML='<p style="color:#666">No products found. Seller needs to add.</p>'; return; }
  list.forEach(p=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<h3>${escapeHtml(p.name)}</h3><div style="font-size:13px;color:#666">${escapeHtml(p.description||'')}</div><div class="price">₹${escapeHtml(p.price)}</div><div style="font-size:12px">Stock: ${escapeHtml(p.stock)}</div>
    <button onclick="addToCart('${p.id}')">Add to Cart</button>
    <button onclick="viewReviews('${p.id}')" style="background:#2196F3">Reviews</button>`;
    c.appendChild(div);
  });
}
async function addToCart(productId){
  const r=await fetch(API+'/api/v1/cart',{
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({productId, quantity:1})
  });
  const d=await r.json();
  if(r.ok){ showMsg('Added to cart','ok'); viewCart(); } else showMsg(d.error||'Failed','err');
}
async function viewCart(){
  const r=await fetch(API+'/api/v1/cart',{headers:{'Authorization':'Bearer '+token}});
  const data=await r.json();
  const el=document.getElementById('cartItems'); el.innerHTML='';
  let total=0, count=0;
  if(!data || data.length===0){ el.innerHTML='<span style="color:#888">Cart empty</span>'; }
  else{
    // Need product prices: fetch products to compute total
    const pr=await fetch(API+'/api/v1/products'); const products=await pr.json();
    const map={}; products.forEach(p=>map[p.id]=p);
    data.forEach(item=>{
      const p=map[item.productId]||{name:item.productId, price:0};
      const lineTotal = (p.price||0)*item.quantity;
      total+=lineTotal; count+=item.quantity;
      const d=document.createElement('div'); d.className='cart-item';
      const safeName = escapeHtml(p.name);
      d.innerHTML=`<span>${safeName} x${item.quantity}</span><span>₹${lineTotal.toFixed(2)} <a href="#" onclick="removeFromCart('${item.productId}');return false" style="color:red">x</a></span>`;
      el.appendChild(d);
    });
  }
  document.getElementById('cartCount').textContent=count;
  document.getElementById('cartTotal').textContent=total.toFixed(2);
}
async function removeFromCart(pid){
  await fetch(API+'/api/v1/cart/'+pid,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
  viewCart();
}
async function checkout(){
  const r=await fetch(API+'/api/v1/orders/checkout',{method:'POST',headers:{'Authorization':'Bearer '+token}});
  const d=await r.json();
  if(r.ok){ showMsg('Order placed! Total ₹'+d.total+' Bill ID '+d.id,'ok'); viewCart(); loadOrders(); }
  else showMsg(d.error||'Checkout failed','err');
}
async function viewReviews(productId){
  const r=await fetch(API+'/api/v1/products/'+productId+'/reviews'); const data=await r.json();
  let txt='Reviews:\n'; if(data.length===0) txt+='No reviews'; else data.forEach(rv=>txt+=`★${rv.rating} ${rv.comment} (by ${rv.userId})\n`);
  const comment=prompt(txt+'\nAdd review comment (or cancel):');
  if(comment===null) return;
  const rating=parseInt(prompt('Rating 1-5:', '5')||'5');
  const pr=await fetch(API+'/api/v1/products/'+productId+'/reviews',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({rating, comment})});
  const pd=await pr.json(); if(pr.ok) alert('Review added'); else alert(pd.error);
}
async function loadOrders(){
  const el=document.getElementById('orderList');
  try{
    const r=await fetch(API+'/api/v1/orders',{headers:{'Authorization':'Bearer '+token}});
    const data=await r.json();
    if(!r.ok || !data || data.length===0){ el.innerHTML='<span style="color:#888">No orders yet</span>'; return; }
    el.innerHTML='';
    data.slice().reverse().forEach(o=>{
      const d=document.createElement('div');
      d.style.cssText='border-bottom:1px solid #eee;padding:6px 0;';
      const stColor=o.status==='shipped'?'green':(o.status==='paid'?'#ff9800':'#2196F3');
      const bill=document.createElement('div');
      bill.innerHTML='';
      const b1=document.createElement('b'); b1.textContent='Bill '+String(o.id).substring(0,8);
      bill.appendChild(b1);
      bill.appendChild(document.createTextNode(' · ₹'+Number(o.total).toFixed(2)+' · '+o.itemCount+' item(s)'));
      const b2=document.createElement('div');
      b2.appendChild(document.createTextNode('Status: '));
      const st=document.createElement('b'); st.style.color=stColor; st.textContent=o.status;
      b2.appendChild(st);
      d.appendChild(bill); d.appendChild(b2); el.appendChild(d);
    });
  }catch(e){ el.innerHTML='<span style="color:red">Could not load orders</span>'; }
}
// ---------- Sri Assistant chat widget ----------
let chatOpen=false, chatGreeted=false;
function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById('chatPanel').style.display=chatOpen?'flex':'none';
  if(chatOpen && !chatGreeted){ chatGreeted=true; botAsk('Hello'); }
  if(chatOpen){ document.getElementById('chatInput').focus(); }
}
function chatAddMsg(who, text){
  const box=document.getElementById('chatMsgs');
  const d=document.createElement('div');
  d.style.cssText='margin:6px 0;text-align:'+(who==='me'?'right':'left');
  const b=document.createElement('div');
  b.style.cssText='display:inline-block;padding:8px 10px;max-width:85%;white-space:pre-line;word-break:break-word;text-align:left;'+(who==='me'?'background:#4CAF50;color:white;border-radius:12px 12px 2px 12px;':'background:#f1f1f1;color:#333;border-radius:12px 12px 12px 2px;');
  b.textContent=String(text).replace(/^Sri Assistant:\s*/,'');
  d.appendChild(b); box.appendChild(d); box.scrollTop=box.scrollHeight;
  return d;
}
function chatChips(list){
  const c=document.getElementById('chatChips'); c.innerHTML='';
  (list||[]).slice(0,4).forEach(s=>{
    const btn=document.createElement('button');
    btn.textContent=s;
    btn.style.cssText='border:1px solid #4CAF50;color:#4CAF50;background:white;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;';
    btn.onclick=()=>{ document.getElementById('chatInput').value=s; sendChat(); };
    c.appendChild(btn);
  });
}
function chatProductCard(p){
  const box=document.getElementById('chatMsgs');
  const d=document.createElement('div'); d.style.cssText='margin:6px 0;';
  const c=document.createElement('div');
  c.style.cssText='border:1px solid #ddd;border-radius:8px;padding:8px;font-size:12px;background:#fafafa;';
  const name=document.createElement('div'); name.style.fontWeight='bold'; name.textContent=p.name;
  const meta=document.createElement('div'); meta.textContent='₹'+Number(p.price).toFixed(2)+' · Stock: '+p.stock;
  const btn=document.createElement('button');
  btn.textContent='Add to Cart';
  btn.style.cssText='margin-top:6px;padding:6px 10px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;';
  btn.onclick=()=>addToCart(p.id);
  c.appendChild(name); c.appendChild(meta); c.appendChild(btn);
  d.appendChild(c); box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function chatOrderCard(o){
  const box=document.getElementById('chatMsgs');
  const d=document.createElement('div'); d.style.cssText='margin:6px 0;';
  const c=document.createElement('div');
  c.style.cssText='border:1px solid #ddd;border-radius:8px;padding:8px;font-size:12px;background:#fafafa;';
  c.textContent='Bill '+String(o.id).substring(0,8)+' · ₹'+Number(o.total).toFixed(2)+' · '+o.status;
  d.appendChild(c); box.appendChild(d); box.scrollTop=box.scrollHeight;
}
async function botAsk(text){
  chatAddMsg('me', text);
  const typing=chatAddMsg('bot','...');
  try{
    const r=await fetch(API+'/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({message:text})});
    const d=await r.json();
    typing.remove();
    if(!r.ok){ chatAddMsg('bot','Sorry, something went wrong. Try again.'); return; }
    chatAddMsg('bot', d.reply||'...');
    chatChips(d.suggestions);
    (d.products||[]).forEach(chatProductCard);
    (d.orders||[]).forEach(chatOrderCard);
  }catch(e){ typing.remove(); chatAddMsg('bot','Cannot reach assistant. Is the server running?'); }
}
function sendChat(){
  const inp=document.getElementById('chatInput');
  const t=inp.value.trim(); if(!t) return; inp.value=''; botAsk(t);
}
document.getElementById('chatInput').addEventListener('keypress',(e)=>{ if(e.key==='Enter') sendChat(); });
async function logout(){
  await fetch(API+'/api/v1/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+token}});
  localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href='/';
}
</script>
</body>
</html>
